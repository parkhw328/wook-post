appId: com.parkhw328.wookpost
productName: wPost
copyright: Copyright © 2026 Hyunwook Park
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: licenses
    to: licenses
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
npmRebuild: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: wPost-${version}-${arch}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: wPost
  installerLanguages: [ko_KR, en_US]
  language: '1042'
  uninstallDisplayName: wPost
  runAfterFinish: true
